<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Treehouse: a safe, moderated chat app for kids aged 8-12.">
<title>Treehouse Kids Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lexend:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#E6F1EB; --surface:#FFFFFF; --surface-2:#F3F8F5; --rail:#1D3A38; --rail-2:#27504C; --rail-ink:#CFE6DE;
  --ink:#15302D; --muted:#58716D; --line:#D4E3DC;
  --leaf:#1F8F57; --leaf-ink:#FFFFFF; --leaf-soft:#DAF1E3;
  --sun:#E9A70F; --sun-soft:#FFF1C9; --coral:#CF4430; --coral-soft:#FCE2DC;
  --grape:#5A4BD3; --grape-soft:#EAE7FC; --sky:#2A7FC4;
  --shadow:0 1px 2px rgba(21,48,45,.06),0 10px 28px rgba(21,48,45,.09);
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1817; --surface:#15231F; --surface-2:#1B2C29; --rail:#08110F; --rail-2:#1B3431; --rail-ink:#A9C9BF;
    --ink:#E4F1EC; --muted:#8FAAA4; --line:#28403B;
    --leaf:#46C07F; --leaf-ink:#07170F; --leaf-soft:#153626;
    --sun:#FFC845; --sun-soft:#3A2F14; --coral:#FF7C66; --coral-soft:#3C201B;
    --grape:#A094FF; --grape-soft:#25214A; --sky:#6AB6F2;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1817; --surface:#15231F; --surface-2:#1B2C29; --rail:#08110F; --rail-2:#1B3431; --rail-ink:#A9C9BF;
  --ink:#E4F1EC; --muted:#8FAAA4; --line:#28403B;
  --leaf:#46C07F; --leaf-ink:#07170F; --leaf-soft:#153626;
  --sun:#FFC845; --sun-soft:#3A2F14; --coral:#FF7C66; --coral-soft:#3C201B;
  --grape:#A094FF; --grape-soft:#25214A; --sky:#6AB6F2;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
svg{flex:none}
.shell{height:100%;display:flex;flex-direction:column;gap:12px;min-height:0}

/* Top bar */
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font:800 26px/1 var(--display);letter-spacing:-.01em;margin-right:auto}
.brand small{font:500 12px/1 var(--body);color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-left:4px;padding:4px 8px;border:1px solid var(--line);border-radius:99px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;font-size:13px;font-weight:500}
.pill.safe{background:var(--leaf-soft);color:var(--leaf)}
.timeleft{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.bar{width:90px;height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf);border-radius:9px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:9px;font-weight:500;font-size:14px;display:flex;gap:6px;align-items:center;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--rail);color:#fff}

/* App grid */
.app{flex:1;min-height:0;display:grid;grid-template-columns:76px 250px minmax(0,1fr) 230px;background:var(--surface);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);position:relative}
.rail{background:var(--rail);display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 0;overflow-y:auto}
.rail .sep{width:32px;height:2px;background:var(--rail-2);border-radius:2px}
.club-btn{width:50px;height:50px;border-radius:18px;border:0;display:grid;place-items:center;font-size:24px;background:var(--rail-2);position:relative;transition:border-radius .15s}
.club-btn:hover{border-radius:14px}
.club-btn.on{border-radius:14px;box-shadow:0 0 0 3px var(--sun)}
.club-btn.add{background:transparent;border:2px dashed var(--rail-ink);color:var(--rail-ink);font-size:26px}
.club-btn .dot{position:absolute;right:-2px;top:-2px;min-width:18px;height:18px;border-radius:9px;background:var(--coral);color:#fff;font:600 11px/18px var(--body);padding:0 4px;border:2px solid var(--rail)}
.side{background:var(--surface-2);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-head{padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.side-head h2{margin:0;font:700 21px/1.15 var(--display)}
.modline{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:4px}
.side-body{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:16px}
.group-label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 8px 4px}
.nav-list{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:8px 10px;border-radius:10px;color:var(--muted);font-weight:500;width:100%}
.nav-item:hover{background:var(--line);color:var(--ink)}
.nav-item.on{background:var(--leaf-soft);color:var(--ink)}
.nav-item .hash{font:700 18px/1 var(--display);color:var(--leaf);width:16px;text-align:center}
.nav-item .mini{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:16px}
.pending{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--sun-soft);font-size:13px}
.pending b{display:block;font-weight:600}
.pending span{color:var(--muted);font-size:12px}
.side-foot{border-top:1px solid var(--line);padding:10px 12px;display:flex;align-items:center;gap:10px}
.me-av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:var(--sun-soft)}
.side-foot b{display:block;font-size:14px}
.side-foot span{font-size:12px;color:var(--leaf)}

/* Chat */
.chat{display:flex;flex-direction:column;min-width:0;min-height:0}
.chat-head{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);min-height:62px}
.chat-head h3{margin:0;font:700 20px/1.2 var(--display);display:flex;align-items:center;gap:6px}
.chat-head h3 .hash{color:var(--leaf)}
.chat-head p{margin:0;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-head .grow{flex:1;min-width:0;display:flex;align-items:baseline;gap:12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--leaf)}
.btn.primary{background:var(--leaf);color:var(--leaf-ink);border-color:var(--leaf)}
.btn.danger{background:var(--coral);color:#fff;border-color:var(--coral)}
.btn.ghost{border-color:transparent;background:none}
.menu-btn{display:none}
.tip{margin:12px 18px 0;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--grape-soft);font-size:13.5px}
.tip b{color:var(--grape);font-weight:600}
.tip .x{margin-left:auto}
.msgs{flex:1;overflow-y:auto;padding:14px 18px 8px;display:flex;flex-direction:column;gap:4px}
.day{align-self:center;font-size:12px;color:var(--muted);padding:4px 10px;border-radius:99px;background:var(--surface-2);margin:6px 0}
.msg{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;padding:8px 10px;border-radius:12px;position:relative}
.msg:hover{background:var(--surface-2)}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:22px}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.meta b{font-weight:600}
.meta time{font-size:12px;color:var(--muted)}
.badge{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;display:inline-flex;gap:4px;align-items:center}
.badge.mod{background:var(--leaf-soft);color:var(--leaf)}
.badge.you{background:var(--sun-soft);color:var(--ink)}
.text{overflow-wrap:anywhere}
.text .mention{background:var(--grape-soft);color:var(--grape);border-radius:5px;padding:0 3px;font-weight:500}
.sticker{font-size:44px;line-height:1.1}
.reacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.rx{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:1px 9px;font-size:14px;display:inline-flex;gap:4px;align-items:center}
.rx span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.rx.on{border-color:var(--leaf);background:var(--leaf-soft)}
.picker{display:flex;gap:4px;margin-top:6px;padding:4px;border-radius:12px;background:var(--surface);border:1px solid var(--line);width:max-content;box-shadow:var(--shadow)}
.picker button{border:0;background:none;font-size:20px;padding:4px 6px;border-radius:8px}
.picker button:hover{background:var(--surface-2)}
.actions{display:flex;gap:4px;opacity:0;align-self:start;transition:opacity .12s}
.msg:hover .actions,.msg:focus-within .actions{opacity:1}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;width:32px;height:32px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{color:var(--ink);border-color:var(--muted)}
.icon-btn.flag:hover{color:var(--coral);border-color:var(--coral)}
.hidden-msg{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 10px;padding:10px 12px;border-radius:12px;border:1px dashed var(--line);background:var(--surface-2);font-size:13.5px;color:var(--muted)}
.hidden-msg svg{color:var(--leaf)}
.hidden-msg > span{flex:1 1 220px}
.hidden-msg.reported svg{color:var(--coral)}
.link{border:0;background:none;color:var(--grape);font-weight:600;padding:0;text-decoration:underline;text-underline-offset:2px}
.sys{align-self:center;text-align:center;font-size:13px;color:var(--muted);padding:6px 12px;max-width:520px}
.typing{font-size:12.5px;color:var(--muted);padding:0 20px;height:20px}

.composer{padding:6px 18px 14px}
.warn{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:12px 14px;border-radius:14px;margin-bottom:10px;background:var(--coral-soft);border:1px solid color-mix(in srgb,var(--coral) 35%,transparent)}
.warn.kind{background:var(--sun-soft);border-color:color-mix(in srgb,var(--sun) 50%,transparent)}
.warn .big{font-size:26px;line-height:1}
.warn h4{margin:0 0 2px;font:700 17px/1.25 var(--display)}
.warn p{margin:0;font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px}
.chip:hover{border-color:var(--leaf);color:var(--leaf)}
.compose-row{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1.5px solid var(--line);border-radius:16px;padding:6px 6px 6px 8px}
.compose-row:focus-within{border-color:var(--leaf)}
.compose-row input{flex:1;min-width:0;border:0;background:none;padding:8px 4px;outline:none;font-size:15px}
.stk{display:flex;gap:2px}
.stk button{border:0;background:none;font-size:20px;padding:4px;border-radius:8px}
.stk button:hover{background:var(--line)}
.send{border:0;background:var(--leaf);color:var(--leaf-ink);font-weight:600;border-radius:12px;padding:9px 16px}
.hint{display:flex;align-items:center;gap:6px;margin:8px 4px 0;font-size:12px;color:var(--muted)}
.quiet{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;background:var(--grape-soft)}
.quiet h4{margin:0;font:700 18px/1.2 var(--display)}
.quiet p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.quiet .moon{font-size:34px}

/* Members */
.members{border-left:1px solid var(--line);background:var(--surface-2);overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:14px}
.member{display:flex;align-items:center;gap:10px;padding:5px 6px;font-size:14px}
.member .mini{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:17px;position:relative}
.member .mini::after{content:"";position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:var(--leaf);border:2px solid var(--surface-2)}
.member small{display:block;color:var(--muted);font-size:11.5px}
.safety-card{padding:12px;border-radius:14px;background:var(--leaf-soft);font-size:12.5px;display:flex;flex-direction:column;gap:6px}
.safety-card b{font:700 16px/1.2 var(--display)}
.safety-card ul{margin:0;padding-left:18px}

/* Parent dashboard */
.parent{flex:1;min-height:0;overflow-y:auto;background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}
.p-wrap{max-width:1080px;margin:0 auto;padding:24px 22px 40px;display:flex;flex-direction:column;gap:20px}
.p-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.p-head h1{margin:0;font:800 32px/1.1 var(--display);text-wrap:balance}
.p-head p{margin:4px 0 0;color:var(--muted)}
.p-head .btn{margin-left:auto}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{padding:14px 16px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.stat .lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stat .num{font:800 34px/1 var(--display);font-variant-numeric:tabular-nums}
.stat .num small{font:500 14px var(--body);color:var(--muted)}
.stat .sub{font-size:12.5px;color:var(--muted)}
.stat .bar{width:100%}
.p-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
.p-col{display:flex;flex-direction:column;gap:16px}
.card{border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h2{margin:0;font:700 20px/1.2 var(--display);display:flex;align-items:center;gap:8px}
.card h2 .count{font:600 12px/1 var(--body);background:var(--coral);color:#fff;border-radius:99px;padding:3px 8px}
.card .desc{margin:-6px 0 0;font-size:13px;color:var(--muted)}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .grow{flex:1;min-width:0}
.row b{font-weight:600}
.row .sub{font-size:12.5px;color:var(--muted)}
.row .acts{display:flex;gap:6px}
.log{display:flex;flex-direction:column}
.log-item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
.log-item:first-child{border-top:0}
.tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;white-space:nowrap;height:max-content}
.tag.private{background:var(--coral-soft);color:var(--coral)}
.tag.rude{background:var(--sun-soft);color:var(--ink)}
.tag.mean{background:var(--sun-soft);color:var(--ink)}
.tag.hidden{background:var(--grape-soft);color:var(--grape)}
.tag.report{background:var(--coral);color:#fff}
.log-item q{font-style:italic;color:var(--muted);quotes:"“" "”"}
.log-item .sub{font-size:12px;color:var(--muted)}
.empty{font-size:13.5px;color:var(--muted);padding:8px 0}
.switch{width:46px;height:26px;border-radius:99px;border:0;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--leaf)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
select{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 8px}

/* Modal & toast */
.modal-wrap{position:fixed;inset:0;background:rgba(8,20,18,.45);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);width:min(480px,100%);max-height:calc(100% - 32px);overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
.modal h2{margin:0;font:800 24px/1.15 var(--display);text-wrap:balance}
.modal p{margin:0;color:var(--muted);font-size:14px}
.modal ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.modal ol b{display:block}
.opt{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer}
.opt:has(input:checked){border-color:var(--leaf);background:var(--leaf-soft)}
.opt input{accent-color:var(--leaf)}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.pin{display:flex;gap:8px;justify-content:center}
.pin input{width:52px;height:60px;text-align:center;font:700 26px var(--display);border:1.5px solid var(--line);border-radius:12px;background:var(--surface-2)}
.pin input:focus{border-color:var(--leaf);outline:none}
.err{color:var(--coral);font-size:13px;text-align:center;min-height:18px}
.club-card{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px}
.club-card .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:26px}
.club-card b{font:700 17px/1.2 var(--display)}
.club-card .sub{font-size:12.5px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500}
.field input{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--rail);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:var(--shadow);z-index:60;max-width:calc(100% - 32px)}
.scrim{display:none}

/* Treehouse Island */
.island{flex:1;display:flex;flex-direction:column;min-height:0}
.coins{display:inline-flex;align-items:center;gap:6px;background:var(--sun-soft);color:var(--ink);padding:6px 12px;border-radius:99px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.scene{position:relative;flex:1;min-height:260px;overflow:hidden;cursor:pointer;margin:12px 18px 0;border-radius:18px;user-select:none;-webkit-user-select:none;touch-action:manipulation;isolation:isolate}
.island .chat-head h3{white-space:nowrap}
.scene.plaza{background:linear-gradient(#BFE6FF 0 34%,#9ED98F 34% 100%)}
.scene.beach{background:linear-gradient(#BDE8FF 0 26%,#3FA9D9 26% 44%,#F4DDA0 44% 100%)}
.scene.snow{background:linear-gradient(#CFE0F2 0 34%,#F4F8FC 34% 100%)}
.decor{position:absolute;transform:translate(-50%,-100%);pointer-events:none;line-height:1}
.ava{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;transition-property:left,top;transition-timing-function:linear;pointer-events:none}

.ava .nm{font-size:11px;font-weight:600;background:rgba(255,255,255,.92);color:#15302D;padding:1px 6px;border-radius:6px;margin-top:2px;white-space:nowrap}
.ava.me .nm{background:#FFC845}
.bubble{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#fff;color:#15302D;padding:6px 10px;border-radius:12px;font-size:13px;line-height:1.35;width:max-content;max-width:190px;box-shadow:0 2px 8px rgba(0,0,0,.18);text-align:center}
.bubble::after{content:"";position:absolute;top:100%;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:#fff}
.isl-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 18px 0}
.isl-note{font-size:12px;color:var(--muted);margin:6px 18px 0}
.zone-item .lock{margin-left:auto;font-size:12px;color:var(--muted);display:inline-flex;gap:4px;align-items:center}
.game-wrap{position:fixed;inset:0;background:rgba(8,20,18,.55);display:grid;place-items:center;padding:16px;z-index:55}
.game{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:16px;width:min(400px,100%);display:flex;flex-direction:column;gap:10px}
.game h2{margin:0;font:800 24px/1.1 var(--display)}
.game .hud{display:flex;justify-content:space-between;font-weight:600;font-variant-numeric:tabular-nums}
.game canvas{width:100%;max-width:calc((100vh - 220px) * .75);align-self:center;aspect-ratio:3/4;border-radius:14px;background:linear-gradient(#BFE6FF,#E6F6DF);touch-action:none;cursor:none}
.game p{margin:0;font-size:13.5px;color:var(--muted)}


.ava .body{display:block;line-height:0;transition:transform .15s}
.ava.walking .body svg{animation:waddle .35s ease-in-out infinite alternate}
@keyframes waddle{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--line)}
.sw.on{box-shadow:0 0 0 3px var(--leaf);border-color:var(--surface)}
.hat-opt{display:flex;flex-direction:column;align-items:center;gap:2px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:4px 6px 6px;font-size:11px;min-width:64px}
.hat-opt.on{border-color:var(--leaf);background:var(--leaf-soft)}
.hat-opt[data-locked]{opacity:.55}
.sw{position:relative}
.price{position:absolute;right:-8px;bottom:-8px;font-size:10px;font-weight:600;background:var(--sun-soft);color:var(--ink);border-radius:8px;padding:0 4px;border:1px solid var(--line);white-space:nowrap}
.hat-opt .price{position:static;margin-top:2px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.member .mini svg,.me-av svg{display:block}
@media (prefers-reduced-motion:reduce){.ava.walking .body svg{animation:none}}
@media (max-width:1150px){
  .app{grid-template-columns:76px 240px minmax(0,1fr)}
  .members{display:none}
}
@media (max-width:980px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .p-grid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail,.side{position:absolute;top:0;bottom:0;z-index:20;transition:transform .2s}
  .rail{left:0;width:76px;transform:translateX(-100%)}
  .side{left:76px;width:250px;transform:translateX(calc(-100% - 76px))}
  .app.drawer .rail,.app.drawer .side{transform:none}
  .app.drawer .scrim{display:block;position:absolute;inset:0;background:rgba(8,20,18,.4);z-index:10}
  .menu-btn{display:grid}
  .chat-head p{display:none}
  .pill.safe span,.timeleft span{display:none}
  .stk{display:none}
  .actions{opacity:1}
}
@media (max-width:520px){
  .brand small{display:none}
  .seg button{padding:7px 9px;font-size:13px}
  .stats{grid-template-columns:minmax(0,1fr)}
  .p-head h1{font-size:26px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- Safety filter ---------- */
const MEAN = ['stupid','idiot','dumb','loser','shut up','hate you','ugly','you suck','trash','noob','weirdo','nobody likes you','go away'];
const PRIVATE = [
  {re:/(\d[\s.\-()]?){7,}/, kind:'a phone number', short:'Phone number'},
  {re:/[\w.+-]+@[\w-]+\.[a-z]{2,}/i, kind:'an email address', short:'Email address'},
  {re:/\b\d+[a-z]?,?\s+\w+(\s\w+)?\s+(street|st|road|rd|avenue|ave|lane|ln|drive|dr|nagar|colony|marg|sector)\b/i, kind:'a home address', short:'Home address'},
  {re:/\b(where do (you|u) live|what'?s (your|ur) address|my address is|i live (at|on|near)|which school|what school|my school is|i go to .* school)\b/i, kind:'where someone lives or goes to school', short:'Location / school'},
  {re:/\b(password|passcode|pin is)\b/i, kind:'a password', short:'Password'},
  {re:/\b(snap(chat)?|insta(gram)?|whats ?app|tiktok|discord|telegram|kik|facetime)\b/i, kind:'another app (chats stay on Treehouse)', short:'Other app'},
  {re:/(https?:\/\/|www\.)\S+/i, kind:'a web link', short:'Link'},
  {re:/\b(send|share) (me )?(a |your )?(pic|pics|photo|photos|selfie|picture)\b/i, kind:'a request for photos', short:'Photo request'},
  {re:/\b(meet (up|me)|how old are (you|u)|what'?s your real name|my real name is)\b/i, kind:'private info about you', short:'Personal info'}
];
const RUDE = ['hell','damn','crap','wtf','omg','stfu','shit','fuck','bitch','ass','frick','heck no'];
const whyOf = r => r.type === 'mean' ? 'Unkind word' : r.type === 'rude' ? 'Rude word' : r.short;
function checkMsg(text){
  const n = text.toLowerCase().replace(/0/g,'o').replace(/1/g,'i').replace(/3/g,'e').replace(/@(?=\w)/g,'a').replace(/\$/g,'s');
  for (const p of PRIVATE) if (p.re.test(text) || (p.short !== 'Phone number' && p.re.test(n))) return {type:'private', ...p};
  for (const w of RUDE) if (new RegExp('\\b' + w + '\\b').test(n)) return {type:'rude', word:w};
  for (const w of MEAN) if (new RegExp('\\b' + w.replace(' ', '\\s+') + '\\b').test(n)) return {type:'mean', word:w};
  return null;
}

  el.style.transitionDuration = walk ? Math.max(.3, Math.hypot(x - old.x, y - old.y) / 22) + 's' : '0s';
  el.style.left = x + '%'; el.style.top = y + '%'; el.style.zIndex = Math.round(y * 10);
  el.classList.toggle('walking', !!walk);

  POS[id] = {x, y};

/* ---------- Minigame: Acorn Catch (just for fun, beat your best score) ---------- */
let G = null;
function startGame(){
  closeModal(); stopGame();
  const wrap = document.createElement('div'); wrap.className = 'game-wrap'; wrap.id = 'gameWrap';
  wrap.innerHTML = `<div class="game" role="dialog" aria-modal="true" aria-label="Acorn Catch">
    <h2>🌰 Acorn Catch</h2>
    <p>Move the basket with your mouse, finger or arrow keys. 🌰 = 1 coin, ⭐ = 5 coins. Dodge the 🐛 bugs!</p>
    <div class="hud"><span id="gScore">Score 0</span><span id="gLives">❤️❤️❤️</span><span id="gTime">⏱ 30</span></div>
    <canvas id="gCanvas" width="360" height="480"></canvas>
    <div class="modal-foot" id="gFoot"><span style="margin-right:auto;font-size:13px;color:var(--muted)">Best: ${S.best}</span><button class="btn" data-act="game-close">Stop playing</button></div></div>`;
  document.body.appendChild(wrap);
  const cv = $('#gCanvas'), ctx = cv.getContext('2d');
  G = {cv, ctx, x:180, items:[], score:0, lives:3, end:performance.now() + 30000, last:performance.now(), spawn:0, keys:{}, over:false, raf:0};
  const move = e => { const r = cv.getBoundingClientRect(); G.x = Math.max(28, Math.min(332, (e.clientX - r.left) / r.width * 360)); };
  cv.addEventListener('pointermove', move); cv.addEventListener('pointerdown', move);
  G.kd = e => { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight'){ G.keys[e.key] = true; e.preventDefault(); } };
  G.ku = e => { G.keys[e.key] = false; };
  addEventListener('keydown', G.kd); addEventListener('keyup', G.ku);
  G.raf = requestAnimationFrame(tick);
}
function tick(now){
  if (!G || G.over) return;
  const dt = Math.min(50, now - G.last) / 1000; G.last = now;
  const left = Math.max(0, (G.end - now) / 1000), speedUp = 1 + (30 - left) / 30;
  if (G.keys.ArrowLeft) G.x = Math.max(28, G.x - 320 * dt);
  if (G.keys.ArrowRight) G.x = Math.min(332, G.x + 320 * dt);
  G.spawn -= dt;
  if (G.spawn <= 0){
    const r = Math.random();
    G.items.push({x:rnd(20, 340), y:-20, v:rnd(120, 190) * speedUp, k:r < .12 ? 'star' : r < .32 ? 'bug' : 'acorn'});
    G.spawn = rnd(.35, .7) / speedUp;
  }
  const ctx = G.ctx; ctx.clearRect(0, 0, 360, 480);
  ctx.fillStyle = '#9ED98F'; ctx.fillRect(0, 440, 360, 40);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const it of G.items){
    it.y += it.v * dt;
    if (!it.hit && it.y > 400 && it.y < 440 && Math.abs(it.x - G.x) < 38){
      it.hit = true;
      if (it.k === 'bug') G.lives--; else G.score += it.k === 'star' ? 5 : 1;
    }
    if (!it.hit){ ctx.font = '30px serif'; ctx.fillText(it.k === 'star' ? '⭐' : it.k === 'bug' ? '🐛' : '🌰', it.x, it.y); }
  }
  G.items = G.items.filter(it => !it.hit && it.y < 500);
  ctx.font = '50px serif'; ctx.fillText('🧺', G.x, 420);
  $('#gScore').textContent = 'Score ' + G.score;
  $('#gLives').textContent = '❤️'.repeat(Math.max(0, G.lives)) + '🤍'.repeat(3 - Math.max(0, G.lives));
  $('#gTime').textContent = '⏱ ' + Math.ceil(left);
  if (left <= 0 || G.lives <= 0) return endGame();
  G.raf = requestAnimationFrame(tick);
}
function endGame(){
  G.over = true;
  const record = G.score > S.best; if (record) S.best = G.score; S.coins += G.score;
  const ctx = G.ctx; ctx.fillStyle = 'rgba(255,255,255,.88)'; ctx.fillRect(0, 150, 360, 170);
  ctx.fillStyle = '#15302D'; ctx.font = '700 28px system-ui'; ctx.fillText(G.lives <= 0 ? 'Bugged out!' : 'Time\'s up!', 180, 200);
  ctx.font = '600 22px system-ui'; ctx.fillText(`You earned 🪙 ${G.score} coins`, 180, 245);
  ctx.font = '16px system-ui'; ctx.fillText(`${record ? '🏆 New best! · ' : ''}You have ${S.coins} coins`, 180, 282);
  $('#gFoot').innerHTML = `<button class="btn" data-act="game-close">Back to the island</button><button class="btn primary" data-act="play-game">Play again</button>`;
  if (S.cur.type === 'island'){ islandSide(); const c = document.querySelector('.chat-head .coins'); if (c) c.textContent = '🪙 ' + S.coins; }
  if (record && AV.me) bubble('me', `new best score: ${G.score}! 🏆`);
}
function stopGame(){
  if (G){ cancelAnimationFrame(G.raf); removeEventListener('keydown', G.kd); removeEventListener('keyup', G.ku); G = null; }
  $('#gameWrap')?.remove();
}

  if (Array.isArray(d.owned)) S.owned = new Set(d.owned);
  if (d.look && d.look.color) S.look = d.look;
  if (typeof d.best === 'number') S.best = d.best;
  S.member = !!d.member; if (d.open) S.open = d.open;
  if (typeof d.silly === 'boolean') S.silly = d.silly;
}
function saveLocal(){
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(snapshot()));
    if (S.nick) localStorage.setItem(SAVE_KEY + '-nick', S.nick);
  } catch (e) {}
}
let lastCloud = '';
async function saveCloud(){
  if (!CLOUD.user) return;
  const data = JSON.stringify(snapshot()); if (data === lastCloud) return; lastCloud = data;
  try { await CLOUD.fs.setDoc(CLOUD.fs.doc(CLOUD.db, 'saves', CLOUD.user.uid), {...snapshot(), updatedAt:Date.now()}); }
  catch (e) { console.warn('Cloud save failed', e); lastCloud = ''; }
}
function saveGame(){ saveLocal(); saveCloud(); }
async function initCloud(){
  if (!FIREBASE_CONFIG) return;
  try {
    const base = 'https://www.gstatic.com/firebasejs/13.0.0/';
    const [app, auth, fs] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
    const a = app.initializeApp(FIREBASE_CONFIG);
    Object.assign(CLOUD, {auth:auth.getAuth(a), A:auth, db:fs.getFirestore(a), fs, ready:true});
    auth.onAuthStateChanged(CLOUD.auth, async u => {
      CLOUD.user = u;
      if (u){
        try {
          const snap = await fs.getDoc(fs.doc(CLOUD.db, 'saves', u.uid));
          if (snap.exists()){ applySave(snap.data()); lastCloud = JSON.stringify(snapshot()); toast('Cloud save loaded'); }
          else await saveCloud();
        } catch (e) { console.warn('Cloud load failed', e); toast('Couldn\'t reach the cloud save. Progress still saves in this browser.'); }
      }
      renderAll();
    });
    if (S.view === 'parent') renderParent();
  } catch (e) { console.warn('Cloud save unavailable', e); }
}
async function cloudSignIn(){
  try { await CLOUD.A.signInWithPopup(CLOUD.auth, new CLOUD.A.GoogleAuthProvider()); }
  catch (e) { toast('Sign-in didn\'t finish. Please try again.'); }
}
async function cloudSignOut(){ await CLOUD.A.signOut(CLOUD.auth); toast('Signed out. Progress still saves in this browser.'); }
function saveCardHTML(){
  let status;
  if (!FIREBASE_CONFIG) status = `<div class="row"><div class="grow"><b>Cloud backup is off</b><div class="sub">Progress saves in this browser only. Add your Firebase settings to back it up and use it on any device.</div></div></div>`;
  else if (!CLOUD.ready) status = `<div class="row"><div class="grow"><b>Connecting to cloud backup…</b><div class="sub">If this doesn't change, check the Firebase settings.</div></div></div>`;
  else if (!CLOUD.user) status = `<div class="row"><div class="grow"><b>Cloud backup is ready</b><div class="sub">Sign in with the grown-up's Google account to back up progress.</div></div><button class="btn primary" data-act="cloud-in">Sign in with Google</button></div>`;
  else status = `<div class="row"><div class="grow"><b>Backed up to the cloud ✓</b><div class="sub">Signed in as ${esc(CLOUD.user.email || 'grown-up')}</div></div><button class="btn" data-act="cloud-out">Sign out</button></div>`;
  return `<section class="card"><h2>Saving</h2><p class="desc">Saves coins, shop items, the penguin's look and best score. Chats and nicknames are never uploaded.</p><div>${status}
    <div class="row"><div class="grow"><b>Island progress</b><div class="sub">Reset coins, shop items and the Island Pass</div></div><button class="btn" data-act="p-reset">Start over</button></div></div></section>`;
}
try { applySave(JSON.parse(localStorage.getItem(SAVE_KEY) || 'null')); S.nick = localStorage.getItem(SAVE_KEY + '-nick') || S.nick; } catch (e) {}
setInterval(saveGame, 3000);
addEventListener('pagehide', saveLocal);
addEventListener('visibilitychange', () => { if (document.hidden) saveGame(); });
initCloud();
renderAll();
</script>

</body>
</html>
